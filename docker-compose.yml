# Docker Compose für die Entwicklungsumgebung
# - PostgreSQL 18 (Datenbank)
# - pgAdmin (DB-Browser, nur für Entwicklung)
services:
  db:
    # Voll qualifizierter Name: umgeht Podman "short-name resolution" (enforcing)
    image: docker.io/library/postgres:18
    container_name: coffee_db
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
      POSTGRES_DB: coffee_machine
    ports:
      - "5432:5432"
    volumes:
      # Für Postgres 18+: Mount auf /var/lib/postgresql (pg_ctlcluster-kompatibel)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee_machine"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: coffee_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: coffee@example.com
      PGADMIN_DEFAULT_PASSWORD: coffee
      # Desktop-Modus: automatischer Default-Login, keine Anmeldemaske.
      # Nur für die lokale Entwicklung gedacht (Port 5050 ist im LAN erreichbar).
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASS_FILE: /pgpass
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # z-Label: SELinux (Enforcing) erlaubt dem Container sonst keinen Zugriff
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro,z
      - ./pgadmin/pgpass:/pgpass:ro,z
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data: