[project]
name = "coffee-machine-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.uv]
# App-Projekt ohne Paket-Build; quellbasiertes Arbeiten über src-lose Struktur
package = false

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["."]

[tool.ruff.lint]
# E/F = Pycodestyle/Pyflakes, I = Import-Sortierung, UP = Modernisierungen (pyupgrade)
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true

[tool.ty]
# Alle ty-Regeln als Fehler melden (0.0.86, Beta)
rules = { all = "error" }

# SQLAlchemy liefert für mapped_column() den Typ MappedColumn[Any] zurück, der
# strukturell zu Mapped[T] passt, aber kein Subtyp davon ist. Die Annotation
# Mapped[...] bleibt fachlich korrekt, darum ist die Regel hier stummgeschaltet.
[[tool.ty.overrides]]
include = ["app/models.py"]

[tool.ty.overrides.rules]
unsound-assignment = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
