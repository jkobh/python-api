[project]
name = "coffee-machine-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg>=3.3.6",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.uv]
# App-Projekt ohne Paket-Build; quellbasiertes Arbeiten über src-lose Struktur
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]

[tool.ruff.lint]
# E/F = Pycodestyle/Pyflakes, I = Import-Sortierung, UP = Modernisierungen (pyupgrade)
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true

[tool.ty]
# Alle ty-Regeln als Fehler melden (0.0.86, Beta)
rules = { all = "error" }

[tool.pytest.ini_options]
testpaths = ["tests"]
